features:
  - id: fastify-server
    title: Fastify server
    description: A small Fastify server in ./server exposing runtime introspection endpoints (health, runtime info, echo).
    runnable: true
    steps:
      - description: Install server dependencies
        command: cd server && bun install
      - description: Typecheck the server
        command: cd server && bun run typecheck
      - description: Run the server test suite
        command: cd server && bun test
      - description: Start the server and verify the health endpoint
        command: cd server && (bun run start &) && sleep 2 && curl -sS http://localhost:3000/api/health && kill %1

  - id: target-source-map-roundtrip
    title: TS source map round-trip in ./target
    description: Compile a TypeScript file in ./target so the emitted source map contains the inline original source, then recover the original from the map and verify it is byte-identical to the source file.
    runnable: true
    steps:
      - description: Compile ./target/functions.ts with inline source maps
        command: ./node_modules/.bin/tsc -p target
      - description: Recover functions.ts from the inline source in target/dist/functions.js.map and verify it matches byte-for-byte
        command: bun run target/recover.ts

  - id: control-flow-graph-from-typescript
    title: Control-flow graph from TypeScript
    description: A server endpoint at POST /api/cfg that takes a TypeScript source string and returns a control-flow graph (entry/exit nodes, branches, loops, switch dispatch, try/catch, return/throw/break/continue) for every function-like declaration in the file.
    runnable: true
    steps:
      - description: Install server dependencies
        command: cd server && bun install
      - description: Start the server in the background
        command: cd server && (bun run start &) && sleep 2
      - description: POST a TypeScript snippet and inspect the returned CFG
        command: curl -sS -H 'content-type: application/json' -d '{"source":"function add(a:number,b:number){if(a<0)return -1;return a+b}","filePath":"demo.ts"}' http://localhost:3000/api/cfg
      - description: Stop the background server
        command: pkill -f 'bun run src/index.ts' || true

  - id: mermaid-cfg-websocket
    title: Mermaid flowchart WebSocket for the CFG
    description: A WebSocket endpoint at ws://<host>/api/mermaid that, given an entry file, walks the local-import subgraph, renders every function CFG as a Mermaid `flowchart`, and pushes a fresh snapshot whenever any watched file in the subgraph changes.
    runnable: true
    steps:
      - description: Install server dependencies
        command: cd server && bun install
      - description: Typecheck the server
        command: cd server && bun run typecheck
      - description: Run the server test suite
        command: cd server && bun test
      - description: Start the server pointed at the fixture project root
        command: cd server && (CFG_PROJECT_ROOT=../target/fixtures bun run start &) && sleep 2
      - description: Subscribe over the websocket and capture the first snapshot
        command: cd server && bun -e "import('ws').then(({WebSocket}) => {const ws = new WebSocket('ws://localhost:3000/api/mermaid'); ws.on('open', () => ws.send(JSON.stringify({type:'subscribe', entry:'entry.ts'}))); ws.on('message', (raw) => { const m = JSON.parse(raw.toString()); console.log(m.type, m.entry, m.files); console.log(m.mermaid.split('\\n').slice(0,8).join('\\n')); ws.close(); process.exit(0); }); setTimeout(() => process.exit(1), 3000); })"
      - description: Stop the background server
        command: pkill -f 'bun run src/index.ts' || true
