<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Open a project to get started</title><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap');:root{color-scheme:dark;--bg:#07110e;--fg:#cbd5e1;--card:#091510;--green:#6ee7b7;--sub:#94a3b8;--border:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:14px Inter,system-ui,sans-serif}.top{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;font-weight:600}.logo{color:var(--green);font-size:20px;margin-right:10px}.center{min-height:calc(100vh - 56px);display:grid;place-items:center;padding:24px}.card{width:min(100%,460px);padding:38px 34px;text-align:center;border:1px solid var(--border);border-radius:10px;background:var(--card)}.mark{font-size:30px;color:var(--green);margin-bottom:16px}.title{font-size:20px;font-weight:600;margin-bottom:10px}.copy{font-size:13px;line-height:1.65;color:var(--sub);max-width:350px;margin:auto}.button{display:inline-flex;align-items:center;gap:9px;margin-top:23px;padding:11px 15px;border:1px solid rgba(110,231,183,.35);border-radius:7px;background:rgba(110,231,183,.08);color:var(--green);font-size:13px;font-weight:500}.note{font-size:11px;color:var(--sub);margin-top:15px}.mono{font:11px 'IBM Plex Mono',monospace;color:#a8b5af;margin-top:26px}@media(max-width:500px){.card{padding:30px 22px}}
</style></head><body><header class="top"><span class="logo">◈</span>Runtime Visualizer</header><main class="center"><section class="card"><div class="mark">◈</div><div class="title">Open a project to get started</div><p class="copy">Select a project folder to browse its TypeScript files and explore their analysis and control flow.</p><div class="button"><span>＋</span> Select project folder</div><div class="note">Your files stay in their folder. You can add more projects later.</div><div class="mono">SUPPORTED SOURCE · .ts · .tsx</div></section></main></body></html>
