name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Bun
        # v2.0.2
        uses: >-
          oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: ./scripts/ci-install-dependencies.sh
      - name: Run Oxlint
        run: bun run lint

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Bun
        # v2.0.2
        uses: >-
          oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: ./scripts/ci-install-dependencies.sh
      - name: Run static checks
        run: bun run quality:static

  acceptance_tests:
    name: Acceptance tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Bun
        # v2.0.2
        uses: >-
          oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: ./scripts/ci-install-dependencies.sh
      - name: Install Chromium
        run: cd browser && bunx playwright install --with-deps chromium
      - name: Run browser acceptance tests
        run: bun run quality:acceptance

  regression_tests:
    name: Typical regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Bun
        # v2.0.2
        uses: >-
          oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: ./scripts/ci-install-dependencies.sh
      - name: Run browser regression tests
        run: bun run quality:regression

  quality_policy:
    name: Quality policy
    if: ${{ always() }}
    needs: [lint, static, acceptance_tests, regression_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable quality gate
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          ACCEPTANCE_TESTS_RESULT: ${{ needs.acceptance_tests.result }}
          REGRESSION_RESULT: ${{ needs.regression_tests.result }}
        run: |
          failed=0
          require_success() {
            if test "$1" != "success"; then
              echo "::error title=$2 failed::$2 ended with '$1'."
              echo "Reproduce with: bun run $3"
              failed=1
            fi
          }
          require_success "$LINT_RESULT" "Lint" lint
          require_success "$STATIC_RESULT" "Static" quality:static
          require_success "$ACCEPTANCE_TESTS_RESULT" "Acceptance" \
            quality:acceptance
          require_success "$REGRESSION_RESULT" "Regression" quality:regression
          exit "$failed"
