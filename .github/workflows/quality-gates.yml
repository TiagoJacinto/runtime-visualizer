name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611 # v2.0.2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Oxlint
        run: bun run lint

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611 # v2.0.2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run static checks
        run: bun run quality:static

  acceptance_tests:
    name: Acceptance tests (HVUT)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611 # v2.0.2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run high-value unit tests
        run: bun run quality:acceptance

  browser_hve2e:
    name: Browser HVE2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611 # v2.0.2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bun run frontend:install:playwright -- --with-deps
      - name: Run browser HVE2E
        run: bun run frontend:test:hve2e

  regression_tests:
    name: Typical regression tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611 # v2.0.2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run typical regression tests
        run: bun run quality:regression

  coverage:
    name: Coverage policy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      QUALITY_BASE_SHA: ${{ github.event.before || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611 # v2.0.2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Measure and verify coverage
        run: bun run quality:coverage

  quality_policy:
    name: Quality policy
    if: ${{ always() }}
    needs:
      [lint, static, acceptance_tests, browser_hve2e, regression_tests, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable quality gate
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          ACCEPTANCE_TESTS_RESULT: ${{ needs.acceptance_tests.result }}
          BROWSER_HVE2E_RESULT: ${{ needs.browser_hve2e.result }}
          REGRESSION_TESTS_RESULT: ${{ needs.regression_tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          failed=0
          require_success() {
            if test "$1" != "success"; then
              echo "::error title=$2 failed::$2 ended with '$1'. Reproduce with: $3"
              failed=1
            fi
          }
          require_success "$LINT_RESULT" "Lint" "bun run lint"
          require_success "$STATIC_RESULT" "Static checks" "bun run quality:static"
          require_success "$ACCEPTANCE_TESTS_RESULT" "Acceptance tests (HVUT)" "bun run quality:acceptance"
          require_success "$BROWSER_HVE2E_RESULT" "Browser HVE2E" "bun run frontend:test:hve2e"
          if test "$GITHUB_EVENT_NAME" != "pull_request"; then
            require_success "$REGRESSION_TESTS_RESULT" "Typical regression tests" "bun run quality:regression"
            require_success "$COVERAGE_RESULT" "Coverage policy" "bun run quality:coverage"
          fi
          exit "$failed"
