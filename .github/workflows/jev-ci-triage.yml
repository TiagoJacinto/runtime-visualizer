name: Jev CI triage

on:
  workflow_run:
    workflows: [Quality gates]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  classify-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Collect failed run context
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          gh run view "$RUN_ID" --repo "$REPOSITORY" \
            --json name,conclusion,event,headBranch,headSha,url,pullRequests \
            > run.json
          gh run view "$RUN_ID" --repo "$REPOSITORY" --log-failed > failed.log
          : > changed-files.txt
          if [ -n "$PR_NUMBER" ]; then
            gh api --paginate \
              "/repos/$REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[].filename' > changed-files.txt
          fi

      - name: Build Jev request
        run: |
          bun scripts/classify-ci-failure.ts \
            --logs failed.log \
            --run run.json \
            --changed-files changed-files.txt \
            > jev-request.json

      - name: Ask Jev
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          curl --fail-with-body --retry 2 --retry-delay 2 \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $TYPESAFE_API_KEY" \
            --data-binary @jev-request.json \
            https://api.typesafe.ai/v1/systemone \
            > jev-response.json

      - name: Render triage report
        run: |
          bun scripts/classify-ci-failure.ts \
            --logs failed.log \
            --run run.json \
            --changed-files changed-files.txt \
            --response jev-response.json \
            > jev-report.md

      - name: Comment on pull request
        if: ${{ github.event.workflow_run.pull_requests[0].number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file jev-report.md
