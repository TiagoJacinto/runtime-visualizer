---
name: Deploy frontend

"on":
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: write
    steps:
      - name: Select successful CI run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            workflow_runs="repos/$GITHUB_REPOSITORY/actions/workflows/quality-gates.yml/runs"
            query="branch=main&status=completed&per_page=100"
            run_json=$(gh api "$workflow_runs?$query")
            candidate_ids=$(jq -r \
              '.workflow_runs[] | select(.event == "push") | .id' \
              <<< "$run_json")
            selected_run_id=""
            for candidate in $candidate_ids; do
              jobs="repos/$GITHUB_REPOSITORY/actions/runs/$candidate/jobs"
              job_json=$(gh api "$jobs?per_page=100")
              passed=$(jq '
                [.jobs[] | select(
                  .name == "Lint" or
                  .name == "Static checks" or
                  .name == "Acceptance tests" or
                  .name == "Typical regression tests" or
                  .name == "Quality policy")]
                | length == 5 and all(.[]; .conclusion == "success")
              ' <<< "$job_json")
              if [ "$passed" = "true" ]; then
                selected_run_id=$candidate
                break
              fi
            done
            if [ -z "$selected_run_id" ]; then
              echo "No completed main run with passing CI checks was found." >&2
              exit 1
            fi
            echo "run_id=$selected_run_id" >> "$GITHUB_OUTPUT"
            selected_head_sha=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$selected_run_id" \
              --jq '.head_sha')
            echo "head_sha=$selected_head_sha" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "head_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out source for browser smoke test
        # v4.2.2
        uses: >-
          actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.source.outputs.head_sha }}
          persist-credentials: false
      - name: Download tested frontend build
        # v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-dist
          path: dist
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Set up Bun
        # v2.0.2
        uses: >-
          oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611
        with:
          bun-version: 1.3.14
      - name: Install Chromium for browser smoke test
        run: |
          bun install --frozen-lockfile
          cd browser && bunx playwright install --with-deps chromium
      - name: Record current production deployment
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          deployments="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments?env=production&per_page=1"
          auth_header="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          deployment_json=$(curl --fail --silent --show-error \
            --header "$auth_header" "$deployments")
          deployment_id=$(jq -r '.result[0].id // empty' <<< "$deployment_json")
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          npx --yes wrangler@4.143.0 pages deploy dist \
            --project-name "$PROJECT" --branch main
      - name: Verify production HTTP response
        id: verify_http
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          test -n "$PRODUCTION_URL"
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            "$PRODUCTION_URL" -o /tmp/production.html
          grep -q '<div id="root"></div>' /tmp/production.html
      - name: Verify app starts in Chromium
        id: verify_browser
        working-directory: browser
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          bun --eval '
            import { chromium } from "playwright";
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              const errors = [];
              page.on("pageerror", error => errors.push(error.message));
              await page.goto(process.env.PRODUCTION_URL, {
                waitUntil: "networkidle",
              });
              await page.waitForFunction(
                () => document.querySelector("#root")?.childElementCount > 0,
              );
              if (errors.length) throw new Error(errors.join("\\n"));
            } finally {
              await browser.close();
            }
          '
      - name: Roll back failed production deployment
        if: >-
          failure() && steps.deploy.outcome == 'success' &&
          (steps.verify_http.outcome == 'failure' ||
          steps.verify_browser.outcome == 'failure') &&
          steps.previous.outputs.deployment_id != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous.outputs.deployment_id }}
        run: |
          rollback="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments/$PREVIOUS_DEPLOYMENT_ID/rollback"
          response=$(curl --fail --silent --show-error -X POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$rollback")
          echo "$response" | jq -e '.success == true'
