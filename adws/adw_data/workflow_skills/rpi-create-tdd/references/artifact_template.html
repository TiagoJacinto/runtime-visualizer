<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RPI Artifact</title>
    <style>
      :root {
        color-scheme: light;
        font:
          16px/1.5 system-ui,
          sans-serif;
        color: #172033;
        background: #f5f7fb;
      }
      body {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px;
      }
      .card {
        background: white;
        border: 1px solid #dfe5ef;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 4px 18px #17203312;
      }
      .badge {
        display: inline-block;
        border-radius: 999px;
        padding: 2px 9px;
        background: #e8efff;
        color: #2454b8;
        font-size: 12px;
        font-weight: 700;
      }
      .badge-new {
        background: #e3f7ed;
        color: #147342;
      }
      .badge-warning {
        background: #fff2d8;
        color: #8a5a00;
      }
      .stat {
        display: inline-flex;
        flex-direction: column;
        margin-right: 24px;
      }
      .stat strong {
        font-size: 24px;
      }
      .ba {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      pre {
        overflow: auto;
        background: #f5f7fb;
        padding: 16px;
        border-radius: 8px;
      }
      @media (max-width: 700px) {
        body {
          padding: 16px;
        }
        .ba {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">decision</span>
      <h1>[Artifact title]</h1>
      <p>[Focused explanation of the decision or design.]</p>
    </main>
  </body>
</html>
